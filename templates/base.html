<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Journal{% endblock %} · Journal</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>try { const t = localStorage.theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<dialog id="cal-dlg" aria-label="Calendar" tabindex="-1" autofocus>
  <div class="cal-head">
    <button id="prev" aria-label="Previous">‹</button>
    <button id="month" class="title" title="Pick a month"></button>
    <button id="next" aria-label="Next">›</button>
  </div>
  <div class="grid" id="grid"></div>
  <nav class="side-links">
    <a id="go-today" href="/">Go to today</a>
    <a href="/export.zip">Export</a>
  </nav>
</dialog>
<dialog id="search-dlg" aria-label="Search">
  <form class="search" action="/search">
    <input id="q" name="q" type="search" placeholder="Search" value="{{ q or '' }}" autocomplete="off">
  </form>
</dialog>
<main>
{% block main %}{% endblock %}
</main>
<script>
const DAY = {{ (day.isoformat() if day else today) | tojson }};
const SEL = {{ (day.isoformat() if day else "") | tojson }};
const DAYS = new Set({{ days | tojson }});
</script>
<script>
// Light / dark toggle; the pick overrides the system setting and is remembered.
document.querySelector('.theme-toggle').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.theme = root.dataset.theme; } catch (e) {}
});
</script>
<script type="module" src="{{ url_for('static', filename='calendar.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
